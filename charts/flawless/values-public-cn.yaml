# Public multi-architecture images routed through a mainland-accessible GHCR proxy.
# Keep immutable tags in production; avoid `latest` so mirror caches stay deterministic.
image:
  repository: ghcr.dockerproxy.net/your-org/cisre
  tag: 5.3.1
  pullPolicy: IfNotPresent

imagePullSecrets: []

config:
  NODE_EXEC_IMAGE: ghcr.dockerproxy.net/your-org/cisre-node-exec:1.36
